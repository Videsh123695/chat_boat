<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QorZen Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-wrapper">
    <header class="chat-header">
      <div class="header-status"></div>
      <h1>QorZen Technologies Bot</h1>
    </header>
    <main class="chat-body" id="chatBox">
      <div class="msg bot">Hello! Ask me anything about QorZen courses, internships, or software projects!</div>
    </main>
    <footer class="chat-footer">
      <input type="text" id="userInput" placeholder="Type your query..." autocomplete="off" maxlength="300">
      <button id="sendBtn" aria-label="Send Message">Send</button>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
